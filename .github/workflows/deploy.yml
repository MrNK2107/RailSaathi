name: Deploy to Cloud Run

# Builds both images, pushes them to Artifact Registry and deploys two Cloud Run services.
# One-time setup (project, Artifact Registry repo, Workload Identity Federation, secrets) is
# described in docs/DEPLOYMENT.md. Required repository variables:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
# Optional repository variables:
#   GAR_REPOSITORY (default: railsaathi), BACKEND_SERVICE (default: railsaathi-backend),
#   FRONTEND_SERVICE (default: railsaathi-frontend), RAILWAY_DATA_MODE (default: railradar; demo is refused when
#   APP_ENV=production, so a production deploy needs the RAILRADAR_API_KEY secret to become ready),
#   LLM_PROVIDER (default: gemini), GOOGLE_CLOUD_LOCATION (Vertex AI region, default: us-central1),
#   VPC_NETWORK / VPC_SUBNET (Direct VPC egress to Memorystore, default: default / default),
#   BACKEND_MIN_INSTANCES (default: 2), BACKEND_MAX_INSTANCES (default: 10),
#   STATIONS_URI (gs://bucket/prefix published by scripts/stations.py; unset = the stations baked into the image),
#   DELAY_MODEL_URI (gs://bucket/path/model.joblib; unset = the committed artifact baked into the image),
#   OBSERVATIONS_URI, INTERNAL_OIDC_AUDIENCE, INTERNAL_OIDC_SERVICE_ACCOUNT (the Cloud Scheduler collector and the
#   internal disruption endpoints; unset = those endpoints answer 404),
#   AR_GUIDANCE_ENABLED (unset = AR off in production; set only after the docs/AR_GUIDANCE.md gate passes)
# Secret Manager secrets referenced by the backend: RAILRADAR_API_KEY, REDIS_URL, SESSION_SIGNING_KEY.
# Optional: the Maps browser key for the virtual tour, mounted only when the MAPS_BROWSER_KEY_SECRET repository
# variable names its secret (without it the tour links out to Google Maps and the deploy still works).

# Runs only after the CI workflow has passed for a push to main (never in parallel with it), or by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'railsaathi' }}
  BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE || 'railsaathi-backend' }}
  FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE || 'railsaathi-frontend' }}
  # The commit CI tested (workflow_run), or the dispatched ref's commit.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    # A CI-triggered run deploys only when CI concluded success for a push (not a pull request) to main.
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Compute image names
        id: images
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}"
          echo "backend=${BASE}/backend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${BASE}/frontend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          docker build -t "${{ steps.images.outputs.backend }}" ./backend
          docker push "${{ steps.images.outputs.backend }}"

      - name: Build and push frontend image
        run: |
          docker build -t "${{ steps.images.outputs.frontend }}" ./frontend
          docker push "${{ steps.images.outputs.frontend }}"

      - name: Deploy backend
        id: backend
        run: |
          # Sessions, rate limits and the RailRadar quota live in Memorystore Redis (REDIS_URL, reached through
          # Direct VPC egress), so the backend runs several instances; every replica shares SESSION_SIGNING_KEY.
          # Gemini runs on Vertex AI as the runtime service account (GOOGLE_CLOUD_PROJECT/LOCATION), no API key.
          # TRUSTED_PROXY_HOPS=2: browser -> GFE -> nginx (overwrites X-Forwarded-For with the real client) -> GFE ->
          # backend; the backend GFE appends the nginx egress IP, so the client is the 2nd entry from the right.
          SECRETS="RAILRADAR_API_KEY=RAILRADAR_API_KEY:latest,REDIS_URL=REDIS_URL:latest,SESSION_SIGNING_KEY=SESSION_SIGNING_KEY:latest"
          # Optional secret: mounted only when the repository variable names it, so projects without it still deploy.
          MAPS_SECRET="${{ vars.MAPS_BROWSER_KEY_SECRET || '' }}"
          if [ -n "${MAPS_SECRET}" ]; then
            SECRETS="${SECRETS},GOOGLE_MAPS_BROWSER_KEY=${MAPS_SECRET}:latest"
          fi
          # Env vars are joined with "@" and passed with gcloud's "^@^" delimiter prefix, because some values are
          # comma-separated lists (CORS_ORIGINS, AR_GUIDANCE_ENABLED) that the default "," delimiter would split.
          ENV_VARS="APP_ENV=production@RAILWAY_DATA_MODE=${{ vars.RAILWAY_DATA_MODE || 'railradar' }}@LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'gemini' }}@GOOGLE_CLOUD_PROJECT=${PROJECT_ID}@GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}@TRUSTED_PROXY_HOPS=2@CORS_ORIGINS=${{ vars.FRONTEND_ORIGIN || '' }}"
          # Optional settings: passed only when the repository variable is set, so an empty value never overrides the
          # application default (an empty STATIONS_URI would point the catalogue at nothing).
          add_env() { if [ -n "$2" ]; then ENV_VARS="${ENV_VARS}@$1=$2"; fi; }
          add_env STATIONS_URI "${{ vars.STATIONS_URI || '' }}"
          add_env DELAY_MODEL_URI "${{ vars.DELAY_MODEL_URI || '' }}"
          add_env OBSERVATIONS_URI "${{ vars.OBSERVATIONS_URI || '' }}"
          add_env INTERNAL_OIDC_AUDIENCE "${{ vars.INTERNAL_OIDC_AUDIENCE || '' }}"
          add_env INTERNAL_OIDC_SERVICE_ACCOUNT "${{ vars.INTERNAL_OIDC_SERVICE_ACCOUNT || '' }}"
          add_env AR_GUIDANCE_ENABLED "${{ vars.AR_GUIDANCE_ENABLED || '' }}"
          # Capacity (tuning notes, docs/RUNBOOK.md "Capacity"): one uvicorn worker per 1 vCPU instance; handlers are
          # async and push blocking work (Redis, SQLite, model inference, LLM calls) to anyio's worker pool, which has
          # 40 threads by default, so --concurrency 40 lets every admitted request get a thread without queueing
          # behind others. Most requests take milliseconds; planner/ticketing turns hold a thread for up to
          # LLM_OVERALL_DEADLINE_SECONDS (20 s), so a burst of LLM turns is what saturates an instance and makes Cloud
          # Run add instances. Min 2 keeps one warm spare (startup loads the delay model and the station catalogue)
          # and survives one instance loss; max 10 bounds Redis connections and Gemini spend. These are starting
          # values: confirm them with loadtest/k6/load.js against staging before raising traffic.
          # Traffic gating: the new revision gets no traffic, only a "candidate" tag URL. The next step smoke-tests
          # that URL (/readyz must say ready) and only then "Promote backend" moves traffic to it, so a bad artifact
          # never serves users. Cloud Run rejects --no-traffic when it creates a service, so the very first deploy
          # (no earlier revision to protect) goes without it.
          TRAFFIC="--no-traffic"
          gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format 'value(metadata.name)' \
            >/dev/null 2>&1 || TRAFFIC=""
          gcloud run deploy "${BACKEND_SERVICE}" \
            --image "${{ steps.images.outputs.backend }}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances "${{ vars.BACKEND_MIN_INSTANCES || '2' }}" \
            --max-instances "${{ vars.BACKEND_MAX_INSTANCES || '10' }}" \
            --concurrency 40 \
            --timeout 60 \
            --network "${{ vars.VPC_NETWORK || 'default' }}" --subnet "${{ vars.VPC_SUBNET || 'default' }}" \
            --vpc-egress private-ranges-only \
            --set-env-vars "^@^${ENV_VARS}" \
            --set-secrets "${SECRETS}" \
            ${TRAFFIC} --tag candidate \
            --quiet
          URL="$(gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          CANDIDATE="$(gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "candidate_url=${CANDIDATE}" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend
        # Against the candidate revision, before it receives any traffic.
        run: sh backend/scripts/smoke.sh "${{ steps.backend.outputs.candidate_url }}"

      - name: Promote backend
        run: gcloud run services update-traffic "${BACKEND_SERVICE}" --region "${REGION}" --to-latest --quiet

      - name: Deploy frontend
        id: frontend
        run: |
          # nginx serves static files and proxies /api/*; it is I/O-bound, so 80 concurrent requests per instance and
          # scale to zero are fine (a cold start is well under a second). Same traffic gating as the backend.
          TRAFFIC="--no-traffic"
          gcloud run services describe "${FRONTEND_SERVICE}" --region "${REGION}" --format 'value(metadata.name)' \
            >/dev/null 2>&1 || TRAFFIC=""
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${{ steps.images.outputs.frontend }}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 256Mi \
            --min-instances 0 --max-instances 3 --concurrency 80 \
            --set-env-vars "BACKEND_URL=${{ steps.backend.outputs.url }}" \
            ${TRAFFIC} --tag candidate \
            --quiet
          URL="$(gcloud run services describe "${FRONTEND_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          CANDIDATE="$(gcloud run services describe "${FRONTEND_SERVICE}" --region "${REGION}" --format json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "candidate_url=${CANDIDATE}" >> "$GITHUB_OUTPUT"

      - name: Smoke test frontend (through the nginx proxy)
        # Against the candidate revision, before it receives any traffic.
        run: |
          set -eu
          FE="${{ steps.frontend.outputs.candidate_url }}"
          curl -fsS --max-time 20 "${FE}/healthz"
          curl -fsS --max-time 20 "${FE}/" | grep -q '<div id="root">'
          curl -fsS --max-time 20 "${FE}/api/health" | grep -q '"status":"ok"'
          echo "Frontend: ${FE}"
          echo "Backend:  ${{ steps.backend.outputs.url }}"

      - name: Promote frontend
        run: gcloud run services update-traffic "${FRONTEND_SERVICE}" --region "${REGION}" --to-latest --quiet
