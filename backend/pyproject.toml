[project]
name = "railsaathi-planner"
version = "0.1.0"
description = "RailSaathi AI - unified rail platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.35,<2",
    "tzdata>=2024.1",
    "httpx>=0.27,<1",
    "google-genai>=2.29,<3",
    "redis>=5.0,<7",
    "python-json-logger>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.6",
    "hypothesis>=6.169.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]  # FastAPI Body(...) defaults are idiomatic

[tool.uv]
package = false
