# Security headers, included into every location (nginx does not inherit add_header into a location that sets its own).
#
# Content-Security-Policy, directive by directive (it must stay on ONE line: a newline would end up in the header):
#   default-src 'self'          everything not listed below is same-origin only (the SPA, /api/*, its assets).
#   script-src                  'self' for the hashed Vite bundles, plus the Google Maps JS hosts that the Street View
#                               panorama in the virtual tour loads (@googlemaps/js-api-loader injects a script from
#                               maps.googleapis.com, which pulls modules from *.googleapis.com and *.gstatic.com;
#                               *.google.com and *.ggpht.com / *.googleusercontent.com as Google documents for Maps JS;
#                               blob: for the Maps worker scripts). No 'unsafe-eval' and no 'unsafe-inline': the built
#                               bundles (React, three.js, @react-three/fiber) were checked for eval / new Function and
#                               use neither, and index.html has no inline script.
#   style-src                   'self' + Google Fonts CSS (index.html and index.css) + 'unsafe-inline': React sets style=""
#                               attributes (animation delays, 3D overlay positions) and Maps injects <style>. Inline
#                               styles cannot run script, so this is the usual, accepted relaxation.
#   font-src                    Google Fonts files (fonts.gstatic.com).
#   img-src                     'self' (including /api/stations/{id}/map, the station plan) + data: and blob: (canvas
#                               frames, textures the tour builds from the plan) + Maps tiles and Street View imagery
#                               (*.googleapis.com incl. streetviewpixels-pa.googleapis.com, *.gstatic.com, and
#                               khms*.google.com / *.google.com for satellite and Street View tiles).
#   connect-src                 'self' (the API) + Maps JS data requests (*.googleapis.com, *.google.com, *.gstatic.com)
#                               + data: and blob: (three.js loads textures with fetch of blob/data URLs).
#   media-src / worker-src      blob: only (camera preview stream for AR guidance; Maps / three.js workers).
#   frame-src                   *.google.com: Maps JS may embed a Google frame for Street View and its attribution.
#   frame-ancestors 'none'      nobody may embed this app (clickjacking); X-Frame-Options DENY is the legacy twin.
#   object-src 'none', base-uri 'self', form-action 'self'   close the plugin, <base> and form-post injection routes.
# The camera image used by AR guidance is captured from a canvas and sent to our own /api, so no extra host is needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com; connect-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://*.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Features this app uses are allowed for its own origin only: microphone (voice input), camera (AR guidance),
# geolocation, and the motion sensors that AR guidance and WebXR use (gyroscope, accelerometer, magnetometer for
# deviceorientation, xr-spatial-tracking for the WebXR floor arrow). Nothing is delegated to embedded third parties.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), xr-spatial-tracking=(self)" always;
# One year, subdomains included. Cloud Run terminates TLS and always serves this app over https; nginx sends the
# header on every response so that a browser that reached the site over https never downgrades.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
