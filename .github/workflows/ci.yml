name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov=app --cov-report=term-missing
      # Dependency audit gate: every locked package (runtime and dev groups) against the PyPI advisory database
      # (OSV). pip-audit fails on any known vulnerability, high and critical included; there is no ignore list.
      - name: pip-audit
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt > "${RUNNER_TEMP}/requirements-audit.txt"
          uvx pip-audit==2.10.1 --requirement "${RUNNER_TEMP}/requirements-audit.txt" --require-hashes --disable-pip --progress-spinner off

  frontend:
    name: Frontend (lint + typecheck + vitest coverage + build budgets + nginx image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dependency audit gates. The shipped bundle's dependencies: no high or critical advisory, no exceptions.
      - run: npm audit --omit=dev --audit-level=high
      # The whole tree, dev tooling included: fails on any high or critical advisory not accepted, with a reason and a
      # review date, in audit-allowlist.json (docs/SECURITY.md).
      - run: node scripts/audit-gate.mjs
      - run: npm run lint
      - run: npm run typecheck
      # vitest with v8 coverage; fails below 70 % of lines (vite.config.ts test.coverage.thresholds).
      - run: npm test
      # vite build, then scripts/check-budget.mjs: fails when a gzip bundle budget is exceeded.
      - run: npm run build
      # The image builds (and re-checks the budgets) and its rendered nginx config is valid.
      - run: docker build -t railsaathi-frontend .
      - run: docker run --rm railsaathi-frontend nginx -t

  e2e:
    name: Playwright end to end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      # The production build behind nginx's security headers: CSP in the browser, the service worker, stale chunks.
      - run: npm run e2e:dist
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
