[project]
name = "railsaathi-planner"
version = "0.1.0"
description = "RailSaathi AI - Smart Passenger Planner backend (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "google-genai>=0.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
